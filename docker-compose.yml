name: the-hub

services:
  postgres:
    image: postgres:17-alpine
    container_name: hub-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hub_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-hub}
      # use scram-sha-256 instead of md5
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    ports:
      # only reachable from this machine
      - "127.0.0.1:${POSTGRES_PORT:-5442}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    shm_size: 256mb

  redis:
    image: redis:7.4-alpine
    container_name: hub-redis
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-hub_redis_dev_password}
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:-hub_redis_dev_password}
      - --appendonly
      - "yes"
      - --maxmemory
      - 256mb
      # every key we write has an expiry, so when memory is full Redis drops
      # the least recently used ones
      - --maxmemory-policy
      - volatile-lru
    ports:
      - "127.0.0.1:${REDIS_PORT:-6390}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
  redis_data:
